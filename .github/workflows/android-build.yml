name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project directory
        id: locate
        run: |
          ANDROID_DIR=$(find . -maxdepth 4 -name "settings.gradle.kts" -printf '%h\n' | head -n 1 | sed 's|^\./||')
          if [ -z "$ANDROID_DIR" ]; then
            echo "Could not find Android project (settings.gradle.kts)"
            exit 1
          fi
          echo "dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project at: $ANDROID_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Music-Studio-Debug-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
